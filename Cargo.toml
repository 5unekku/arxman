[package]
name = "arxman"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
sevenz-rust = { version = "0.6", features = ["compress"] }
walkdir = "2"
